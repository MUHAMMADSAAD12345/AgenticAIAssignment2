<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5}
      .agent{fill:#eef4ff;stroke:#2f5fb3;stroke-width:1.8}
      .ext{fill:#f4f4f4;stroke:#777;stroke-width:1.5}
      .db{fill:#fff8e6;stroke:#b38600;stroke-width:1.5}
      .t{font-weight:600;font-size:14px}
      .s{fill:#444;font-size:12px}
      .l{fill:#2f5fb3;font-size:12px}
      .m{fill:#8a3b00;font-size:12px}
      line,path.e{stroke:#333;stroke-width:1.4;fill:none}
    </style>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700">SpaceMolt MAS - agents, A2A tasks, MCP calls, memory</text>

  <!-- LLM -->
  <rect class="ext" x="40" y="60" width="230" height="78" rx="8"/>
  <text class="t" x="155" y="85" text-anchor="middle">Groq LLM (gpt-oss-20b)</text>
  <text class="s" x="155" y="105" text-anchor="middle">JSON plan + rationale</text>
  <text class="s" x="155" y="122" text-anchor="middle">budget: 300 req / 250k tok / 2 per min</text>

  <!-- Coordinator -->
  <rect class="agent" x="340" y="55" width="320" height="150" rx="10"/>
  <text class="t" x="500" y="80" text-anchor="middle">Coordinator / Planner  (mas.coordinator)</text>
  <text class="s" x="355" y="103">1. observe both pilots (A2A observe tasks)</text>
  <text class="s" x="355" y="121">2. combined progress vs targets + budgets</text>
  <text class="s" x="355" y="139">3. LLM plan  -&gt; validate (whitelist, freshness, caps)</text>
  <text class="s" x="355" y="157">   invalid / no budget -&gt; deterministic fallback</text>
  <text class="s" x="355" y="175">4. delegate one task per pilot, in parallel</text>
  <text class="s" x="355" y="193">5. record results, resume unfinished on restart</text>

  <line x1="340" y1="100" x2="272" y2="100" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Coordinator DB -->
  <rect class="db" x="720" y="60" width="250" height="110" rx="8"/>
  <text class="t" x="845" y="84" text-anchor="middle">coordinator.sqlite3</text>
  <text class="s" x="735" y="106">tasks (mission id, status, a2a id, result)</text>
  <text class="s" x="735" y="124">cycles (plan, source, rationale)</text>
  <text class="s" x="735" y="142">observations, heartbeat</text>
  <text class="s" x="735" y="160">+ budget.sqlite3, runtime.sqlite3</text>
  <line x1="660" y1="115" x2="718" y2="115" marker-end="url(#a)"/>

  <!-- A2A arrows -->
  <path class="e" d="M430,205 L250,300" marker-end="url(#a)"/>
  <path class="e" d="M570,205 L750,300" marker-end="url(#a)"/>
  <text class="l" x="290" y="245" text-anchor="end">A2A JSON-RPC task (port 9999)</text>
  <text class="l" x="290" y="262" text-anchor="end">{mission_id, skill, pilot, params}</text>
  <text class="l" x="705" y="245">A2A JSON-RPC task (port 9998)</text>
  <text class="l" x="705" y="262">artifact = JSON result</text>

  <!-- Mining agent -->
  <rect class="agent" x="60" y="300" width="330" height="130" rx="10"/>
  <text class="t" x="225" y="325" text-anchor="middle">Mining Agent  (separate process)</text>
  <text class="s" x="75" y="348">skills: observe, mine_cycle</text>
  <text class="s" x="75" y="366">belt selection, alternate belt on depletion</text>
  <text class="s" x="75" y="384">fuel / hull / cargo safety gates</text>
  <text class="s" x="75" y="402">mutation ledger: sent -&gt; confirmed</text>
  <text class="s" x="75" y="420">resume from checkpoint after restart</text>

  <!-- Trading agent -->
  <rect class="agent" x="610" y="300" width="330" height="130" rx="10"/>
  <text class="t" x="775" y="325" text-anchor="middle">Trading / Logistics Agent  (separate process)</text>
  <text class="s" x="625" y="348">skills: observe, accept_mission, sell_and_complete,</text>
  <text class="s" x="625" y="366">list_item, explore_adjacent</text>
  <text class="s" x="625" y="384">reserve mission ore, sell surplus above bid floor</text>
  <text class="s" x="625" y="402">reconcile unknown sale outcome vs cargo</text>
  <text class="s" x="625" y="420">duplicate mission id -&gt; stored result (no replay)</text>

  <!-- worker DBs -->
  <rect class="db" x="40" y="545" width="210" height="56" rx="8"/>
  <text class="t" x="145" y="568" text-anchor="middle">mining_agent.sqlite3</text>
  <text class="s" x="145" y="587" text-anchor="middle">missions, actions, checkpoints</text>
  <line x1="120" y1="430" x2="120" y2="543" marker-end="url(#a)"/>
  <rect class="db" x="750" y="545" width="210" height="56" rx="8"/>
  <text class="t" x="855" y="568" text-anchor="middle">trading_agent.sqlite3</text>
  <text class="s" x="855" y="587" text-anchor="middle">missions, actions, accepted</text>
  <line x1="880" y1="430" x2="880" y2="543" marker-end="url(#a)"/>

  <!-- MCP server -->
  <rect class="ext" x="320" y="540" width="360" height="72" rx="10"/>
  <text class="t" x="500" y="562" text-anchor="middle">SpaceMolt MCP v2 server</text>
  <text class="s" x="500" y="581" text-anchor="middle">game.spacemolt.com/mcp/v2 (spacemolt, spacemolt_auth,</text>
  <text class="s" x="500" y="598" text-anchor="middle">spacemolt_market ...) pilots MenInBlack-P1 / -P2, nebula</text>

  <path class="e" d="M300,430 L420,538" marker-end="url(#a)"/>
  <path class="e" d="M700,430 L580,538" marker-end="url(#a)"/>
  <text class="m" x="335" y="470" text-anchor="end">MCP: initialize, list_tools,</text>
  <text class="m" x="345" y="486" text-anchor="end">login, get_status, travel,</text>
  <text class="m" x="355" y="502" text-anchor="end">mine, dock, get_poi</text>
  <text class="m" x="668" y="470">MCP: get_missions, accept_mission,</text>
  <text class="m" x="658" y="486">complete_mission, view_market,</text>
  <text class="m" x="648" y="502">sell, jump, refuel</text>

  <text class="s" x="500" y="632" text-anchor="middle">All agents append redacted JSONL events to logs/events*.jsonl (timestamp, agent, task id, A2A id, MCP action, args, confirmation, errors, recovery)</text>
</svg>
